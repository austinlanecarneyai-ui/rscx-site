<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Choose New Password</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.png" type="image/png">
<script src="config.js"></script>
<script src="accounts.js"></script>
</head>
<body>
<p><a href="index.html">RS Classic Continuum accounts</a> | <a href="signup.html">Create account</a> | <a href="signin.html">Sign in</a> | <a href="account.html">My account</a> | <a href="forgot.html">Forgot password</a> | <a href="inbox.html">Inbox</a> | <a href="tickets.html">Support</a> | <a href="privacy.html">Privacy</a></p>
<hr>
<h1>Choose a new password</h1>
<form id="reset">
  <p><label>New password<br><input id="password" type="password" autocomplete="new-password" maxlength="20" required></label><br>
  <small>4 to 20 characters.</small></p>
  <p><label>New password again<br><input id="password2" type="password" autocomplete="new-password" maxlength="20" required></label></p>
  <p><button type="submit">Set password</button></p>
</form>
<p id="result" role="status"></p>
<p id="next" hidden><a href="signin.html">Sign in</a></p>
<pre id="errors" hidden></pre>
<script>
var resetToken = Accounts.linkToken();
if (!resetToken) {
  document.getElementById('reset').hidden = true;
  Accounts.say('result', 'This page needs the link from your email. Ask for a new one on the Forgot password page.');
}
Accounts.onSubmit('reset', function () {
  if (Accounts.value('password') !== Accounts.value('password2')) {
    Accounts.say('result', 'The two passwords are different.');
    return;
  }
  Accounts.say('result', 'Saving...');
  return Accounts.call('POST', '/api/reset', { token: resetToken, password: Accounts.value('password') })
    .then(function (r) {
      if (r.status === 200) {
        Accounts.forget();
        Accounts.say('result', 'Your password is changed. Use it in the game, the launcher and here. '
          + 'Every device that was signed in has been signed out.');
        document.getElementById('reset').hidden = true;
        document.getElementById('next').hidden = false;
      } else {
        Accounts.say('result', r.body.error || ('Failed (' + r.status + ').'));
      }
    });
});
</script>
</body>
</html>
