<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign In</title>
<script src="config.js"></script>
<script src="accounts.js"></script>
</head>
<body>
<p><a href="index.html">RS Classic Continuum accounts</a> | <a href="signup.html">Create account</a> | <a href="signin.html">Sign in</a> | <a href="account.html">My account</a> | <a href="forgot.html">Forgot password</a> | <a href="privacy.html">Privacy</a></p>
<hr>
<h1>Sign in</h1>
<form id="signin">
  <p><label>Character name<br><input id="name" autocomplete="username" maxlength="12" required></label></p>
  <p><label>Password<br><input id="password" type="password" autocomplete="current-password" maxlength="20" required></label></p>
  <p><label><input id="stay" type="checkbox"> Stay signed in on this device for 30 days</label></p>
  <p><button type="submit">Sign in</button></p>
</form>
<p id="result" role="status"></p>
<p><a href="signup.html">Create account</a> | <a href="forgot.html">Forgot password?</a></p>
<pre id="errors" hidden></pre>
<script>
Accounts.onSubmit('signin', function () {
  Accounts.say('result', 'Signing in...');
  var stay = document.getElementById('stay').checked;
  return Accounts.call('POST', '/api/signin', {
    name: Accounts.value('name'),
    password: Accounts.value('password'),
    stay: stay
  }).then(function (r) {
    if (r.status === 200 && r.body.token) {
      Accounts.forget();
      Accounts.keep(r.body.token, stay);
      window.location.href = 'account.html';
    } else {
      Accounts.say('result', r.body.error || ('Sign-in failed (' + r.status + ').'));
    }
  });
});
</script>
</body>
</html>
