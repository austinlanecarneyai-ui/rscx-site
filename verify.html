<h1>Confirm email</h1>
<p id="result" role="status">Confirming...</p>
<p><a href="account.html">Go to my account</a></p>
<pre id="errors" hidden></pre>
<script>
(function () {
  var token = Accounts.linkToken();
  if (!token) {
    Accounts.say('result', 'This page needs the link from your email. Open the link again, or send a new one from your account.');
    return;
  }
  Accounts.call('POST', '/api/verify', { token: token }).then(function (r) {
    Accounts.say('result', r.status === 200
      ? 'Your email is confirmed. You can play, and use it to reset a forgotten password.'
      : (r.body.error || ('Confirming failed (' + r.status + ').')) + ' You can send a new link from your account.');
  });
})();
</script>
